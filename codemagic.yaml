# بناء تطبيق رخصتي للآيفون على أجهزة ماك في Codemagic ورفعه إلى TestFlight
workflows:
  rukhsati-ios:
    name: رخصتي — آيفون
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios-app
    integrations:
      app_store_connect: manakh_asc        # نفس مفتاح App Store Connect حق مناخ وسُقيا وخدماتي
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.salemaljabri.rukhsati
      node: 20
      xcode: latest
    scripts:
      - name: تثبيت الحزم وتجهيز الملفات
        script: |
          npm install
          npm run build
      - name: إنشاء مشروع iOS
        script: |
          [ -d ios ] || npx cap add ios
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "[0-9,]*";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          [ -f ios/App/Podfile ] && sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/" ios/App/Podfile
          npm run assets
          npx cap sync ios
      - name: إعدادات التطبيق (الاسم، اللغة)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string رخصتي" $PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ar" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string ar" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string whatsapp" $PLIST || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST || true
      - name: التوقيع
        script: xcode-project use-profiles
      - name: رقم البناء
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: بناء ملف IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios-app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # ---------------- أندرويد: ملف AAB لجوجل بلاي ----------------
  rukhsati-android:
    name: رخصتي — أندرويد
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios-app
    environment:
      android_signing:
        - rukhsati_keystore              # اسم مفتاح التوقيع اللي تسويه في Codemagic
      node: 20
      java: 21
    scripts:
      - name: تثبيت الحزم وتجهيز الملفات
        script: |
          npm install
          npm run build
      - name: إنشاء مشروع أندرويد
        script: |
          [ -d android ] || npx cap add android
          npm run assets:android
          npx cap sync android
      - name: التوقيع ورقم الإصدار
        script: |
          python3 - <<'PY'
          import os, re
          p = 'android/app/build.gradle'
          s = open(p).read()
          code = int(os.environ.get('BUILD_NUMBER', '1')) + 1
          s = re.sub(r'versionCode \d+', 'versionCode %d' % code, s)
          s = re.sub(r'versionName "[^"]*"', 'versionName "1.0"', s)
          if 'signingConfigs' not in s:
              s = s.replace('    buildTypes {', '''    signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {''', 1)
              s = re.sub(r'(buildTypes \{\s*release \{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
          open(p, 'w').write(s)
          assert 'signingConfig signingConfigs.release' in s, 'signing not applied'
          print('versionCode', code)
          PY
          grep -n "versionCode\|signingConfig\|CM_KEY" android/app/build.gradle
      - name: بناء ملف AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - ios-app/android/app/build/outputs/**/*.aab
